<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whiteboard · FDE Learning & Planning</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132238;background:#fff}button{font:inherit;cursor:pointer}.wb{width:100vw;height:100vh;display:flex;flex-direction:column;background:#fff}.top{height:78px;flex:0 0 78px;border-bottom:1px solid #e2e7ee;display:flex;align-items:center;padding:0 28px;gap:18px;background:#fff;z-index:20}.title{display:flex;align-items:center;gap:13px;min-width:285px}.logo{width:35px;height:35px;border:3px solid #247cf0;border-radius:7px;display:grid;place-items:center;color:#247cf0;font-size:20px}.title strong{font-size:22px}.divider{height:32px;width:1px;background:#e1e5eb}.name{font-size:16px;font-weight:600}.spacer{flex:1}.tool{height:45px;min-width:45px;padding:0 12px;border:1px solid #e1e6ed;background:#fff;border-radius:10px;color:#18283e;font-size:18px;display:grid;place-items:center}.tool:hover{background:#f4f7fb}.primary{background:#247cf0;color:#fff;border-color:#247cf0;padding:0 20px;display:flex;align-items:center;gap:8px}.export{display:flex;align-items:center;gap:8px;padding:0 18px}.body{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff;background-image:linear-gradient(#edf1f5 1px,transparent 1px),linear-gradient(90deg,#edf1f5 1px,transparent 1px);background-size:34px 34px}.canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.tools{position:absolute;left:17px;top:24px;width:72px;border:1px solid #e0e5ec;border-radius:13px;background:rgba(255,255,255,.97);box-shadow:0 5px 20px rgba(25,43,65,.08);padding:7px;z-index:10;display:grid;gap:4px}.toolbtn{height:51px;border:0;background:#fff;border-radius:9px;font-size:26px;color:#15263d;display:grid;place-items:center}.toolbtn:hover,.toolbtn.active{background:#e8f1ff;color:#247cf0}.small-divider{height:1px;background:#e3e7ed;margin:2px 4px}.sticky{position:absolute;right:22px;top:24px;width:252px;border:1px solid #e0e5ec;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 5px 20px rgba(25,43,65,.08);padding:20px;z-index:10}.sticky h3{margin:0 0 16px;font-size:17px}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.color{height:61px;border-radius:7px;border:1px solid #e0e4ea}.yellow{background:#ffe98c}.pink{background:#ffb3c5}.blue{background:#9fd1ff}.green{background:#bce99d}.purple{background:#c9b0ff}.add{background:#fff;font-size:30px;color:#58677a}.map{position:absolute;left:17px;bottom:20px;width:270px;height:185px;border:1px solid #e0e5ec;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 5px 20px rgba(25,43,65,.08);padding:16px;z-index:10}.maphead{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}.minigrid{height:115px;border:1px solid #dce3eb;background-image:linear-gradient(#e6edf5 1px,transparent 1px),linear-gradient(90deg,#e6edf5 1px,transparent 1px);background-size:8px 8px;position:relative}.viewport{position:absolute;left:30%;top:12%;width:40%;height:65%;border:1.5px solid #247cf0;background:#247cf022}.controls{position:absolute;right:22px;bottom:22px;height:62px;border:1px solid #e0e5ec;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 5px 20px rgba(25,43,65,.08);display:flex;align-items:center;gap:15px;padding:0 15px;z-index:10}.controls button{border:0;background:transparent;font-size:26px;color:#172940;width:30px}.slider{width:120px;accent-color:#247cf0}.help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:#8a96a5;background:#fff;padding:5px 10px;border-radius:99px;z-index:5}.popup{position:absolute;right:20px;top:70px;z-index:30;min-width:210px;border:1px solid #dce3ea;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(26,43,64,.16);padding:10px;display:none}.popup button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:9px;border-radius:7px}.popup button:hover{background:#f1f5f9}.textinput{position:absolute;z-index:25;border:1px solid #247cf0;outline:0;padding:5px 7px;background:#fff;font:16px Inter;color:#132238;min-width:180px}@media(max-width:700px){.top{height:64px;flex-basis:64px;padding:0 10px;gap:8px}.title{min-width:auto}.title strong{font-size:18px}.divider,.name{display:none}.export{display:none}.primary{padding:0 10px}.sticky{display:none}.map{display:none}.tools{left:8px}.controls{right:8px}.help{display:none}}
</style></head><body><div class="wb"><header class="top"><div class="title"><div class="logo">□</div><strong>Whiteboard</strong><div class="divider"></div><span class="name">FDE Learning & Planning</span><span>⌄</span></div><button class="tool" onclick="undo()">↶</button><button class="tool" onclick="redo()">↷</button><button class="tool" onclick="zoom(-.1)">−</button><span id="zoomLabel" style="min-width:52px;text-align:center;font-weight:600">100%</span><button class="tool" onclick="zoom(.1)">+</button><div class="spacer"></div><button class="tool primary" onclick="share()">♧ <span>Share</span></button><button class="tool export" onclick="exportPNG()">⇩ <span>Export</span></button><button class="tool" onclick="toggleMenu()">⋮</button></header><main class="body" id="body"><canvas id="canvas" class="canvas"></canvas><div class="tools"><button class="toolbtn active" data-tool="select">↖</button><button class="toolbtn" data-tool="rect">□</button><button class="toolbtn" data-tool="ellipse">○</button><button class="toolbtn" data-tool="line">╱</button><button class="toolbtn" data-tool="pen">♢</button><button class="toolbtn" data-tool="text">T</button><button class="toolbtn" data-tool="sticky">▱</button><button class="toolbtn" data-tool="image">▧</button><div class="small-divider"></div><button class="toolbtn" data-tool="eraser">⌫</button></div><aside class="sticky"><h3>Sticky Notes</h3><div class="colors"><button class="color yellow" data-color="#ffe98c"></button><button class="color pink" data-color="#ffb3c5"></button><button class="color blue" data-color="#9fd1ff"></button><button class="color green" data-color="#bce99d"></button><button class="color purple" data-color="#c9b0ff"></button><button class="color add" onclick="addSticky()">+</button></div></aside><div class="map"><div class="maphead"><span>Canvas Map</span><button class="tool" style="height:28px;min-width:28px;padding:0;border:0" onclick="fit()">⛶</button></div><div class="minigrid"><div class="viewport"></div></div></div><div class="controls"><button onclick="zoom(-.1)">⌕</button><input id="slider" class="slider" type="range" min="50" max="200" value="100" oninput="setZoom(this.value/100)"><button onclick="zoom(.1)">+</button><button onclick="fit()">⛶</button></div><div class="help">Space + drag to pan · Scroll to zoom · Double-click for text</div><div id="popup" class="popup"><button onclick="clearBoard()">Clear canvas</button><button onclick="exportPNG()">Export PNG</button><button onclick="fit()">Fit canvas</button><button onclick="fullscreen()">Toggle fullscreen</button></div></main></div>
<script>
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d'),body=document.getElementById('body');let tool='select',color='#ffe98c',z=1,origin={x:0,y:0},objects=[],history=[],redoStack=[],drawing=false,start=null;
function resize(){let r=body.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+'px';cv.style.height=r.height+'px';render()}function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-origin.x)/z,y:(e.clientY-r.top-origin.y)/z}}function snap(){return JSON.stringify(objects)}function commit(){history.push(snap());if(history.length>40)history.shift();redoStack=[]}function render(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.save();ctx.translate(origin.x,origin.y);ctx.scale(z,z);objects.forEach(o=>{ctx.save();if(o.type==='stroke'){ctx.strokeStyle=o.color;ctx.lineWidth=o.width;ctx.lineCap='round';ctx.beginPath();o.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}if(o.type==='rect'){ctx.strokeStyle='#247cf0';ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,o.w,o.h)}if(o.type==='ellipse'){ctx.strokeStyle='#247cf0';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,Math.PI*2);ctx.stroke()}if(o.type==='line'){ctx.strokeStyle='#247cf0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x2,o.y2);ctx.stroke()}if(o.type==='sticky'){ctx.fillStyle=o.color;ctx.strokeStyle='#d6bd58';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#243247';ctx.font='14px Inter';(o.text||'Double-click to edit').split('\n').forEach((t,i)=>ctx.fillText(t,o.x+10,o.y+24+i*18))}if(o.type==='text'){ctx.fillStyle='#132238';ctx.font='16px Inter';ctx.fillText(o.text,o.x,o.y)}ctx.restore()});ctx.restore();document.getElementById('zoomLabel').textContent=Math.round(z*100)+'%';document.getElementById('slider').value=Math.round(z*100)}function setZoom(v){z=Math.max(.5,Math.min(2,v));render()}function zoom(d){setZoom(z+d)}function fit(){z=1;origin={x:0,y:0};render()}function undo(){if(!objects.length)return;redoStack.push(snap());objects=history.length?JSON.parse(history.pop()):[];render()}function redo(){if(!redoStack.length)return;history.push(snap());objects=JSON.parse(redoStack.pop());render()}
cv.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;if(tool==='select')return;drawing=true;start=point(e);if(tool==='pen'||tool==='eraser')objects.push({type:'stroke',color:tool==='eraser'?'#fff':'#132238',width:tool==='eraser'?16:3,points:[start]})};cv.onpointermove=e=>{if(!drawing)return;if(tool==='pen'||tool==='eraser'){objects.at(-1).points.push(point(e));render()}};cv.onpointerup=e=>{if(!drawing)return;drawing=false;let p=point(e);if(tool==='rect')objects.push({type:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y});if(tool==='ellipse')objects.push({type:'ellipse',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y});if(tool==='line')objects.push({type:'line',x:start.x,y:start.y,x2:p.x,y2:p.y});commit();render()};cv.onpointercancel=()=>drawing=false;
cv.ondblclick=e=>{if(tool!=='text'&&tool!=='select')return;let p=point(e),input=document.createElement('input');input.className='textinput';input.style.left=(p.x*z+origin.x)+'px';input.style.top=(p.y*z+origin.y-20)+'px';body.appendChild(input);input.focus();const done=()=>{let t=input.value.trim();if(t)objects.push({type:'text',x:p.x,y:p.y,text:t});input.remove();if(t){commit();render()}};input.onkeydown=k=>{if(k.key==='Enter')done()};input.onblur=done};
function addSticky(c=color,x=220,y=180){objects.push({type:'sticky',x,y,w:180,h:120,color:c,text:'Double-click to edit'});commit();render()}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool;if(tool==='sticky')addSticky()});document.querySelectorAll('.color[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;addSticky(color,220+Math.random()*140,160+Math.random()*100)});
function clearBoard(){if(confirm('Clear the whole whiteboard?')){commit();objects=[];render()}document.getElementById('popup').style.display='none'}function exportPNG(){let a=document.createElement('a');a.download='fde-whiteboard.png';a.href=cv.toDataURL('image/png');a.click()}function share(){if(navigator.share)navigator.share({title:'FDE Learning & Planning Whiteboard',text:'FDE architecture whiteboard'}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>alert('Whiteboard link copied.'))}function toggleMenu(){let p=document.getElementById('popup');p.style.display=p.style.display==='block'?'none':'block'}function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
body.onwheel=e=>{e.preventDefault();setZoom(z*(e.deltaY>0?.92:1.08))};window.onresize=resize;document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Escape')document.getElementById('popup').style.display='none'};resize();
</script></body></html>
